<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Interactivity in JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Interactive Fun!</h1>

    <h2>1. Event Handling</h2>
    <button id="clickButton">Click Me</button>
    <div class="hover-effect">Hover Over Me</div>
    <input type="text" id="keypressInput" placeholder="Type something here">
    <div id="output"></div>
    <button id="doubleClickButton">Double Click/Long Press Me for a Secret!</button>
    <div id="secretAction" style="margin-top: 10px; color: purple; font-weight: bold; display: none;">🤫 Secret Action Triggered!</div>

    <h2>2. Interactive Elements </h2>
    <button id="changeTextButton" class="button-change">Change Text</button>
    <button id="changeColorButton" class="button-change">Change Color</button>

    <div class="gallery-container">
        <div class="gallery-item">Image 1</div>
        <div class="gallery-item">Image 2</div>
        <div class="gallery-item">Image 3</div>
    </div>

    <div class="tab-container">
        <div class="tab-buttons">
            <button onclick="openTab('tab1')">Tab 1</button>
            <button onclick="openTab('tab2')">Tab 2</button>
            <button onclick="openTab('tab3')">Tab 3</button>
        </div>
        <div id="tab1" class="tab-content active">Content for Tab 1</div>
        <div id="tab2" class="tab-content">Content for Tab 2</div>
        <div id="tab3" class="tab-content">Content for Tab 3</div>
    </div>

    <div class="animated-element"></div>

    <h2>3. Form Validation </h2>
    <div class="form-container">
        <form id="myForm">
            <div class="form-group">
                <label for="requiredField">Required Field:</label>
                <input type="text" id="requiredField" name="requiredField" oninput="validateRequired()">
                <p class="error-message" id="requiredFieldError"></p>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" oninput="validateEmail()">
                <p class="error-message" id="emailError"></p>
            </div>
            <div class="form-group">
                <label for="password">Password (min 8 characters):</label>
                <input type="password" id="password" name="password" oninput="validatePassword()">
                <p class="error-message" id="passwordError"></p>
            </div>
            <button type="submit">Submit</button>
        </form>
        <div id="formOutput" style="margin-top: 10px;"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
